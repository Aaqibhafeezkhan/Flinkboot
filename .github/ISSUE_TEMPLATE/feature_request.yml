name: "Feature or Connector Request"
description: Suggest an idea for a new feature, improvement, or connector module
title: "[Feature]: "
labels: ["feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature. Please describe your use case and proposed design.

  - type: checkboxes
    id: checklist
    attributes:
      label: Search & Verification
      description: Please check the following before submitting.
      options:
        - label: I have searched existing issues and feature requests to ensure this is not a duplicate.
          required: true

  - type: textarea
    id: problem-motivation
    attributes:
      label: Problem or Motivation
      placeholder: What problem does this feature solve? What is your use case?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution & Desired YAML / Java API
      placeholder: Describe the desired YAML configuration format and Java API surface.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: Any alternative solutions or workarounds you have considered?

  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to contribute
      description: If you would like to implement this feature, check the box below and wait for a maintainer to officially accept and assign the issue before opening a PR.
      options:
        - label: I would like to submit a Pull Request to implement this feature (please wait for the issue to be accepted and assigned before starting).
